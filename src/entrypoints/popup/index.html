<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPhotos Annotator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">
    <h1>GPhotos Annotator</h1>

    <label for="spreadsheet-id">ID de la spreadsheet :</label>
    <input type="text" id="spreadsheet-id" placeholder="ID Google Sheets">

    <div id="user-info" style="margin-top: 12px;">
      <span style="color: #666;">Utilisateur : </span>
      <span id="current-user">non défini</span>
      <button id="reset-user" style="margin-left: 8px; font-size: 11px;">Changer</button>
    </div>

    <button id="save-btn" style="margin-top: 12px;">Enregistrer</button>
    <div id="status" style="margin-top: 8px; font-size: 12px; color: #666;"></div>
  </div>
  <script type="module" src="popup.ts"></script>
</body>
</html>
